<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Assets Explorer | Ultra</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=JetBrains+Mono&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.4/dist/protobuf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --bg-panel: #0a0a0a;
            --bg-hover: #141414;
            --accent: #293cce;
            --accent-hover: #3a4df0;
            --border: #1a1a1a;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --radius: 12px;
            --font-main: 'Quicksand', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 320px;
            min-width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 { font-size: 1.4rem; font-weight: 600; color: #fff; letter-spacing: -0.5px; }
        .sidebar-header p { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 2px; }

        #tree-root {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Tree Items */
        .node-row {
            cursor: pointer;
            padding: 10px 14px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--text-muted);
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            margin-bottom: 4px;
        }

        .node-row:hover { background-color: var(--bg-hover); color: var(--text); }
        .node-row.active { background-color: var(--accent); color: #fff; }

        .folder-group { margin-left: 20px; display: none; border-left: 1px solid var(--border); padding-left: 6px; }
        .folder-group.open { display: block; }

        .icon-sm { width: 18px; height: 18px; margin-right: 12px; fill: currentColor; display: flex; align-items: center; }
        .chevron { width: 14px; height: 14px; transition: 0.3s; opacity: 0.4; margin-right: 6px; }
        .folder-node.open > .node-row > .chevron { transform: rotate(90deg); }

        /* Main Viewport */
        #viewport {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            position: relative;
        }

        .toolbar {
            height: 80px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toolbar.visible { transform: translateY(0); }

        .toolbar-info { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 16px; }

        .btn-group { display: flex; gap: 12px; }
        .btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn:hover { background: #222; border-color: #444; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(41, 60, 206, 0.4); }
        .btn-success { background: #1db954; border-color: #1db954; color: white; }

        .content-area {
            flex-grow: 1;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        /* Renderers */
        .preview-img { max-width: 100%; max-height: 80vh; border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); transition: transform 0.3s; }
        .preview-img:hover { transform: scale(1.02); }
        
        .preview-video { width: 100%; max-width: 1000px; border-radius: 12px; background: #000; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

        .preview-code-container { width: 100%; height: 100%; background: #050505; border-radius: var(--radius); border: 1px solid var(--border); padding: 0; overflow: hidden; display: flex; flex-direction: column; }
        .code-header { background: #111; padding: 10px 20px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        .preview-code { margin: 0 !important; padding: 25px !important; overflow: auto !important; height: 100%; font-family: var(--font-code) !important; font-size: 14px !important; }

        /* Hex Viewer for Binary */
        .hex-viewer { font-family: var(--font-code); font-size: 13px; color: #00ff41; background: #050505; padding: 30px; border-radius: var(--radius); width: 100%; height: 100%; overflow: auto; line-height: 1.5; }

        .placeholder { text-align: center; color: var(--text-muted); }
        .placeholder svg { opacity: 0.1; margin-bottom: 25px; }

        /* Scrollbar Customization */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body>

<aside id="sidebar">
    <div class="sidebar-header">
        <h1>DOT ASSETS</h1>
        <p>Advanced Resource Explorer</p>
    </div>
    <div id="tree-root"></div>
</aside>

<main id="viewport">
    <div id="empty-state" class="placeholder" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>Choose a file to inspect</p>
    </div>

    <div id="toolbar" class="toolbar">
        <div class="toolbar-info">
            <span id="active-filename">file_name.ext</span>
        </div>
        <div class="btn-group">
            <a id="dl-link" href="#" class="btn" download>Download</a>
            <button id="copy-btn" class="btn btn-primary">Copy Link</button>
        </div>
    </div>

    <div id="content-area" class="content-area"></div>
</main>

<script>
    const UI = (() => {
        const SVG = {
            folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
            file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>',
            chevron: '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>'
        };

        const EXT_MAP = {
            img: ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'ico', 'avif'],
            vid: ['mp4', 'webm', 'mov', 'ogg'],
            code: ['txt', 'md', 'json', 'js', 'css', 'html', 'ts', 'yaml', 'py', 'c', 'cpp', 'go', 'rs', 'php', 'exe', 'bat', 'bin', 'sh']
        };

        let currentUrl = '';
        let activeEl = null;

        const init = async () => {
            try {
                const [proto, bin] = await Promise.all([
                    protobuf.load("tree.proto"),
                    fetch('./files.bin').then(r => r.arrayBuffer())
                ]);

                const FileTree = proto.lookupType("FileTree");
                const decoded = FileTree.decode(new Uint8Array(bin));
                const data = FileTree.toObject(decoded, { enums: String });

                renderTree(data.root, document.getElementById('tree-root'));
                setupActions();
            } catch (e) {
                console.error("Init Error:", e);
                document.getElementById('tree-root').innerHTML = `<p style="color:#ff4444; font-size:12px; padding:20px;">Missing Configuration (files.bin)</p>`;
            }
        };

        const renderTree = (nodes, container) => {
            if (!nodes) return;
            nodes.sort((a,b) => (b.type === 'FOLDER' ? 1 : -1) - (a.type === 'FOLDER' ? 1 : -1)); // Cartelle prima

            nodes.forEach(node => {
                const div = document.createElement('div');
                const row = document.createElement('div');
                row.className = 'node-row';

                if (node.type === 'FOLDER') {
                    div.className = 'folder-node';
                    row.innerHTML = `${SVG.chevron}<span class="icon-sm">${SVG.folder}</span>${node.name}`;
                    const group = document.createElement('div');
                    group.className = 'folder-group';
                    row.onclick = () => { div.classList.toggle('open'); group.classList.toggle('open'); };
                    div.appendChild(row);
                    div.appendChild(group);
                    renderTree(node.children, group);
                } else {
                    row.innerHTML = `<span class="icon-sm" style="margin-left:18px">${SVG.file}</span>${node.name}`;
                    row.onclick = () => {
                        if (activeEl) activeEl.classList.remove('active');
                        row.classList.add('active');
                        activeEl = row;
                        handlePreview(node);
                    };
                    div.appendChild(row);
                }
                container.appendChild(div);
            });
        };

        const handlePreview = async (node) => {
            const ext = node.name.split('.').pop().toLowerCase();
            const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
            currentUrl = baseUrl + (node.path.startsWith('/') ? node.path.substring(1) : node.path);

            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('toolbar').classList.add('visible');
            document.getElementById('active-filename').textContent = node.name;
            document.getElementById('dl-link').href = currentUrl;

            const viewer = document.getElementById('content-area');
            viewer.innerHTML = '<p style="color:var(--text-muted)">Loading asset...</p>';

            try {
                if (EXT_MAP.img.includes(ext)) {
                    viewer.innerHTML = `<img src="${currentUrl}" class="preview-img">`;
                } else if (EXT_MAP.vid.includes(ext)) {
                    viewer.innerHTML = `<video src="${currentUrl}" class="preview-video" controls autoplay></video>`;
                } else if (EXT_MAP.code.includes(ext)) {
                    const text = await fetch(currentUrl).then(r => r.text());
                    viewer.innerHTML = `
                        <div class="preview-code-container">
                            <div class="code-header">${node.name.toUpperCase()} - SOURCE</div>
                            <pre class="preview-code"><code class="language-${ext === 'js' ? 'javascript' : ext}">${escapeHtml(text)}</code></pre>
                        </div>`;
                    Prism.highlightAllUnder(viewer);
                } else {
                    // Fallback: Hex Viewer per files binari o sconosciuti
                    const buffer = await fetch(currentUrl).then(r => r.arrayBuffer());
                    viewer.innerHTML = `
                        <div class="preview-code-container">
                            <div class="code-header">${node.name.toUpperCase()} - BINARY HEX VIEW</div>
                            <div class="hex-viewer">${renderHex(buffer)}</div>
                        </div>`;
                }
            } catch (err) {
                viewer.innerHTML = `<p style="color:#ff4444">Failed to load preview.</p>`;
            }
        };

        const renderHex = (buffer) => {
            const view = new DataView(buffer);
            let hex = '';
            for (let i = 0; i < Math.min(view.byteLength, 5000); i += 16) {
                let line = i.toString(16).padStart(8, '0') + '  ';
                let chars = '';
                for (let j = 0; j < 16; j++) {
                    if (i + j < view.byteLength) {
                        const v = view.getUint8(i + j);
                        line += v.toString(16).padStart(2, '0') + ' ';
                        chars += (v > 31 && v < 127) ? String.fromCharCode(v) : '.';
                    } else {
                        line += '   ';
                    }
                }
                hex += line + ' |' + chars + '|\n';
            }
            if (view.byteLength > 5000) hex += '\n... [File truncated for performance]';
            return hex;
        };

        const escapeHtml = (unsafe) => {
            return unsafe.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        };

        const setupActions = () => {
            const btn = document.getElementById('copy-btn');
            btn.onclick = () => {
                navigator.clipboard.writeText(currentUrl);
                const original = btn.textContent;
                btn.textContent = 'Link Copied!';
                btn.className = 'btn btn-success';
                setTimeout(() => {
                    btn.textContent = original;
                    btn.className = 'btn btn-primary';
                }, 1500);
            };
        };

        return { init };
    })();

    document.addEventListener('DOMContentLoaded', UI.init);
</script>
</body>
</html>
